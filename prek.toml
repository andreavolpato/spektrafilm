#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["commit-msg", "pre-commit"]
default_stages             = ["pre-commit"]

[[repos]]
repo  = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-vcs-permalinks" },
  { id = "check-merge-conflict" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-xml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "trailing-whitespace" },
  { id = "mixed-line-ending" },
  { id = "end-of-file-fixer" },
]

# [[repos]]
# repo  = "https://github.com/editorconfig-checker/editorconfig-checker"
# rev   = "v3.11.1"
# hooks = [
#   { id = "editorconfig-checker" },
# ]

[[repos]]
repo  = "https://github.com/google/yamlfmt"
rev   = "v0.21.0"
hooks = [
  { id = "yamlfmt" },
]

[[repos]]
repo  = "https://github.com/owenlamont/ryl-pre-commit"
rev   = "v0.21.0"
hooks = [
  { id = "ryl", args = ["--fix"] },
]

[[repos]]
repo  = "https://github.com/tombi-toml/tombi-pre-commit"
rev   = "v1.4.1"
hooks = [
  { id = "tombi-format", exclude = '(^|/)Cargo\.lock$' },
  { id = "tombi-lint", exclude = '(^|/)Cargo\.lock$' },
]

[[repos]]
repo  = "https://github.com/biomejs/pre-commit"
rev   = "v2.5.10"
hooks = [
  { id = "biome-check" },
]

[[repos]]
repo  = "https://github.com/rvben/rumdl-pre-commit"
rev   = "v0.2.60"
hooks = [
  { id = "rumdl-fmt" },
  { id = "rumdl" },
]

# [[repos]]
# repo  = "https://github.com/lycheeverse/lychee"
# rev   = "nightly"
# hooks = [
#   { id = "lychee" },
# ]

[[repos]]
repo  = "local"
hooks = [
  {
    id             = "just-fmt",
    name           = "just-fmt",
    language       = "system",
    entry          = "just --fmt --unstable --check",
    files          = "(^|/)(justfile|Justfile)(\\..*)?$|\\.just$",
    pass_filenames = false,
  },
]

[[repos]]
repo  = "https://github.com/scop/pre-commit-shfmt"
rev   = "v3.13.1-1"
hooks = [
  { id = "shfmt", args = ["-i", "2", "-ci", "-s"] },
]

[[repos]]
repo  = "https://github.com/shellcheck-py/shellcheck-py"
rev   = "v0.11.0.1-1"
hooks = [
  {
    id   = "shellcheck",
    args = ["--external-sources"],
  },
]

[[repos]]
repo  = "https://github.com/astral-sh/ruff-pre-commit"
rev   = "v0.16.4"
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix", "--show-fixes"], types_or = ["python", "pyi"] },
  { id = "ruff-format", types_or = ["python", "pyi"] },
]

# [[repos]]
# repo  = "https://github.com/astral-sh/ty-pre-commit"
# rev   = "v0.0.74"
# hooks = [
#   { id = "ty" },
# ]

[[repos]]
repo  = "https://github.com/rhysd/actionlint"
rev   = "v1.7.12"
hooks = [
  { id = "actionlint" },
]

[[repos]]
repo  = "https://github.com/zizmorcore/zizmor-pre-commit"
rev   = "v1.29.0"
hooks = [
  {
    id             = "zizmor",
    args           = ["--min-severity", "low", "--min-confidence", "medium", "."],
    pass_filenames = false,
  },
]

[[repos]]
repo  = "https://github.com/hadolint/hadolint"
rev   = "v2.15.1"
hooks = [
  { id = "hadolint" },
]

[[repos]]
repo  = "https://github.com/crate-ci/committed"
rev   = "v1.1.11"
hooks = [
  { id = "committed" },
]


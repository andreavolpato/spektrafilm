#:schema https://raw.githubusercontent.com/j178/prek/refs/heads/master/prek.schema.json
#:tombi toml-version = "v1.1.0"

default_install_hook_types = ["commit-msg", "pre-commit", "pre-push"]
default_stages = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "end-of-file-fixer", exclude = { glob = ["**/*.age", "**/*.gpg"] } },
  { id = "mixed-line-ending", exclude = { glob = ["**/*.age", "**/*.gpg"] } },
  { id = "trailing-whitespace" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo  = "https://github.com/lyz-code/yamlfix/"
rev   = "1.19.1"
hooks = [
  { id = "yamlfix", args = ["--config-file=.yamlfix.toml"] },
]

[[repos]]
repo  = "https://github.com/biomejs/pre-commit"
rev   = "v2.5.6"
hooks = [
  { id = "biome-check", files = "\\.json$" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v0.9.9"
hooks = [
  { id = "tombi-format", exclude = '(^|/)Cargo\.lock$' },
  { id = "tombi-lint" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.11"
hooks = [
  { id = "ruff", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.64"
hooks = [
  { id = "ty", args = ["--isolated"] },
]

[[repos]]
repo = "https://github.com/crate-ci/committed"
rev = "v1.1.11"
hooks = [
  { id = "committed" },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.27"
hooks = [
  { id = "rumdl" },
  { id = "rumdl-fmt" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.45.1"
hooks = [
  {
    id = "typos",
  },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  {
    id = "shellcheck",
    args = ["--external-sources"],
  },
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.12.0-2"
hooks = [
  { id = "shfmt" },
]

[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.6.1"
hooks = [
  { id = "betterleaks" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "check-gitignore", name = "Check no gitignored files are tracked",
    entry = "bash",
    args = ["-c", "f=$(git ls-files --cached --ignored --exclude-standard); if [ -n \"$f\" ]; then echo 'ERROR: These files are gitignored but still tracked:'; echo \"$f\"; exit 1; fi"],
    language = "system", pass_filenames = false, always_run = true },
]

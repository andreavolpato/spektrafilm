[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spektrafilm"
version = "0.3.4"
description = "Spectral simulation of analog film photography"
readme = "README.md"
requires-python = "~=3.13"
license = { text = "GPLv3" }
authors = [
    { name = "Andrea Volpato", email = "volpedellenevi@gmail.com" },
]
dependencies = [
    # Core runtime — the physical-pipeline core under `spektrafilm/`.
    # See studies/a40_lut_system/n070_runtime_architecture_split.md for
    # why the runtime is the one layer that imports nothing from the
    # GUI or LUT-creator packages.
    "numpy~=2.4",
    "scipy~=1.17",
    "colour-science~=0.4.6",
    "scikit-image~=0.26",
    "matplotlib~=3.10",
    "opt-einsum~=3.4.0",
    "numba~=0.64",
    "OpenImageIO~=3.1.11",
    "pyfftw~=0.15.0",
    "rawpy~=0.26.1",
    "exiv2~=0.18.1",
    "lensfunpy~=1.18.0",
    # GUI app dependencies — installed by default because the package
    # ships the `spektrafilm` entry point, but not imported by the core
    # physical runtime under `spektrafilm/`.
    "qtpy~=2.4",
    "pyside6~=6.9",
    "napari~=0.6.6",
    "Pillow~=12.1",
    "pyconify~=0.2.1",
    # LUT creator dependencies — also installed by default because the
    # package ships the `spektrafilm-lut` entry point, but they are not
    # required by the core runtime.
    "markdown~=3.7",
]

[project.optional-dependencies]
# Test/dev tooling on top of the default install.
dev = [
    "pytest",
    "opencolorio~=2.5",   # PyOpenColorIO; validates emitted config.ocio files
]

[project.scripts]
spektrafilm = "spektrafilm_gui.app:main"
spektrafilm-lut = "spektrafilm_lut_creator.cli:main"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "spektrafilm",
    "spektrafilm.*",
    "spektrafilm_gui",
    "spektrafilm_gui.*",
    "spektrafilm_lut_creator",
    "spektrafilm_lut_creator.*",
]

[tool.setuptools.package-data]
spektrafilm = [
    "data/**/*",
]
spektrafilm_gui = [
    "assets/*",
]


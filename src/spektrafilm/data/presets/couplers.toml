# DIR-coupler gamma presets, keyed by film stock.
#
# Loaded by spektrafilm.data.presets_loader.read_coupler_presets and applied in
# params_builder._apply_couplers_preset. A `defaults.<color|bw>.<positive|
# negative>` table seeds the baseline for the film's class; a per-stock table
# overrides individual gammas. Stocks/classes with no table keep the
# DirCouplersParams schema defaults.
#
# gamma_samelayer_rgb is a 3-vector (R, G, B self-inhibition); the interlayer
# gammas are 2-vectors (donor -> the two other receivers). B&W (n_ch == 1) uses
# only gamma_samelayer_rgb[0]; its interlayer entries are inert but kept so the
# params mirror the color defaults.
#
# Optimized on 2026/06/07 from study a22

# --- defaults
[defaults.color.positive]
gamma_samelayer_rgb = [0.2291, 0.1029, 0.2651]
gamma_interlayer_r_to_gb = [0.1449, 0.1560]
gamma_interlayer_g_to_rb = [0.0496, 0.0874]
gamma_interlayer_b_to_rg = [0.0571, 0.2462]

[defaults.color.negative]
gamma_samelayer_rgb = [0.5159, 0.5934, 0.2829]
gamma_interlayer_r_to_gb = [0.4032, 0.2488]
gamma_interlayer_g_to_rb = [0.2227, 0.4340]
gamma_interlayer_b_to_rg = [0.1829, 0.1799]

[defaults.bw.positive]
gamma_samelayer_rgb = [0.2291, 0.1029, 0.2651]

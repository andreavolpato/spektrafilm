# Spectral-upsampling LUT descriptor (sidecar for the co-located .npy).
# Read by the runtime spectral-LUT registry to drive ONE generic consume path:
# identifier -> load spectra -> relight x E_ref, integrate, midgray-normalize ->
# apply_lut_cubic_2d(tc) * b. One descriptor per LUT in this folder.

identifier = "arctic2026beta03"
file = "arctic2026beta03_reflectance_xy_tc.npy"
kind = "reflectance"                          # "reflectance" (relight + midgray-norm) | "irradiance" (direct)
title = "arctic2026 (beta03)"

[array]
lut_size = 192                                # array is (lut_size, lut_size, bands) over the tc chromaticity grid
bands = 81
spectral_shape = [380, 780, 5]                # start, end, interval (nm)
dtype = "float16"
observer = "CIE 1931 2 Degree Standard Observer"

[reflectance]                                 # present iff kind = "reflectance"
scene_illuminant = "D65"                      # recovered under it; runtime _rgb_to_tc_b projection MUST match
midgray = 0.184                               # self-normalization neutral (green channel -> 1 after relight)
bounded = false                               # unbounded metamer; R may exceed 1 (max ~4 after unit-brightness rescale)

[meta]
method = "Per-cell smoothest-metamer QP (chromaticity fixed, prior-guided realistic SHAPE), then RE-NORMALIZED to unit XYZ-sum per cell."
source = "spektrafilm-research study c30 (s102_gain_field -> s105_release_lut beta03); release arctic2026beta03 (2026-06-14)"
notes = "Shipped as the unit-brightness variant R / sum(C.R): same convention as jakob/otsu (XYZ sums to 1), so brightness comes from the scene b, not the LUT. Bake variant 'alpha' (flat realism window), smoothness lambda 0.005, forward-model rank 32 (recon RMSE in-locus mean 0.0022). CHANGES since beta02: (1) fixed a coverage-mask bug where datasets reaching the grid edge had the smoothstep zero-anchor clipped onto the edge index, forcing the prior weight to 0 exactly at 380/780 and collapsing the recovered reflectance (incl. white) at both endpoints; the virtual zero-anchor is now kept as an off-grid wavelength so edge bands retain full prior weight. (2) the non-natural/artificial prior (munsell matt+gloss, ecostress non-veg, usgs manmade) no longer fades radially with distance from white -- those measured materials keep full reach to the locus rim. White verified unit-bright (sum(C.R)=1.000006), neutral (xy err 9e-6), flat 0.0085 over 400-700 nm."

# Spectral-upsampling LUT descriptor (sidecar for the co-located .npy).
# Read by the runtime spectral-LUT registry to drive ONE generic consume path:
# identifier -> load spectra -> relight x E_ref, integrate, midgray-normalize ->
# apply_lut_cubic_2d(tc) * b. One descriptor per LUT in this folder.

identifier = "mallett2019"
file = "mallett2019_reflectance_xy_tc.npy"
kind = "reflectance"                          # "reflectance" (relight + midgray-norm) | "irradiance" (direct)
title = "Mallett & Yuksel 2019 — three-function sRGB basis reflectance"

[array]
lut_size = 192                                # array is (lut_size, lut_size, bands) over the tc chromaticity grid
bands = 81
spectral_shape = [380, 780, 5]                # start, end, interval (nm)
dtype = "float16"
observer = "CIE 1931 2 Degree Standard Observer"

[reflectance]                                 # present iff kind = "reflectance"
scene_illuminant = "D65"                      # sRGB white; recovered/encoded under it. Runtime _rgb_to_tc_b
                                              # projection MUST use the same white, or neutrals drift
midgray = 0.184                               # self-normalization neutral (green channel -> 1 after relight)
bounded = true                                # values in [0, 1] (basis is bounded within sRGB; OOG clips)

[meta]
method = "Reflectance = sum_k linear_sRGB_k * basis_k(l), baked per tc chromaticity from XYZ_unit -> linear sRGB."
source = "Mallett & Yuksel 2019; spektrafilm"
notes = "Baked from compute_mallett2019_reflectance_lut. mallett is linear in RGB -> exactly scale-separable, so the tc LUT reproduces the per-pixel rgb_to_raw_mallett2019 EXACTLY in-gamut (no tc loss). Differs only out-of-sRGB-gamut: the LUT clips reflectance to [0,1] (like jakob/otsu); the per-pixel path leaves it unclipped."

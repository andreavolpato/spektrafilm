# Spectral-upsampling LUT descriptor (sidecar for the co-located .npy).
# Read by the runtime spectral-LUT registry to drive ONE generic consume path:
# identifier -> load spectra -> relight x E_ref, integrate, midgray-normalize ->
# apply_lut_cubic_2d(tc) * b. One descriptor per LUT in this folder.

identifier = "gauss-lasers"
file = "gauss_lasers_reflectance_xy_tc.npy"
kind = "reflectance"                          # "reflectance" (relight + midgray-norm) | "irradiance" (direct)
title = "gauss-lasers — double-Gaussian rim metamer (study c50)"

[array]
lut_size = 192                                # array is (lut_size, lut_size, bands) over the tc chromaticity grid
bands = 81
spectral_shape = [380, 780, 5]                # start, end, interval (nm)
dtype = "float16"
observer = "CIE 1931 2 Degree Standard Observer"

[reflectance]                                 # present iff kind = "reflectance"
scene_illuminant = "D65"                      # recovered under it; runtime _rgb_to_tc_b projection MUST match
midgray = 0.184                               # self-normalization neutral (green channel -> 1 after relight)
bounded = false                               # unit-XYZ-sum rescale lifts narrow peaks above 1 (R/sum(C.R))

[meta]
method = "Parametric double-Gaussian rim metamer R(l) = (1-t)*G(l1,s) + t*G(l2,s): a chroma-exact single-peak BASIN, an analytic spectral-locus RIM (s at the narrow bound), seam-free purple CORRIDORS (two peaks pinned at the visible bounds), green-seam reparametrisation + per-side field relaxation, then a constant-white crossfade. Cubic-baked onto the tc grid (red/blue sides interpolated separately across the discontinuous green seam; the seam gap extrapolated from the red side)."
source = "spektrafilm-research study c50 (c50_double_peak_spectral_upsampling, s011 -> s012); 2026-06-19"
notes = "Shipped as the unit-brightness variant R / sum(C.R): same convention as jakob/otsu/arctic (XYZ sums to 1), so brightness comes from the scene b, not the LUT. White cell (tc≈0.472,0.479): sum(C.R)=1.000000, xy err=9.90e-03."
